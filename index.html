<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c0f">
  <title>Al Raked Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="greeting" aria-live="polite">
          <p id="greetingText">Good day, Sir</p>
          <p id="greetingArabic">مرحبا يا سيدي</p>
        </div>
        <p class="brand">Al Raked</p>
        <p class="subtitle">Command Center</p>
      </div>
      <div class="actions" aria-label="Dashboard actions">
        <button class="icon-button" id="refreshBtn" type="button" aria-label="Refresh dashboard">
          <svg class="icon refresh-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11a8 8 0 1 0-2.35 5.65"></path>
            <path d="M20 5v6h-6"></path>
          </svg>
        </button>
        <button class="icon-button theme-toggle" id="themeBtn" type="button" aria-label="Toggle theme">
          <svg class="icon theme-icon moon-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5Z"></path>
          </svg>
          <svg class="icon theme-icon sun-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
        </button>
      </div>
    </header>

    <nav class="tabs" aria-label="Dashboard sections">
      <button class="tab is-active" type="button" data-page="overview">Overview</button>
      <button class="tab" type="button" data-page="employees">Employees</button>
      <button class="tab" type="button" data-page="services">Services</button>
      <button class="tab" type="button" data-page="oil">Oil</button>
      <button class="tab" type="button" data-page="zeena">Zeena</button>
      <button class="tab" type="button" data-page="company">Company</button>
      <button class="tab" type="button" data-page="employeeLookup">Employee Lookup</button>
      <button class="tab" type="button" data-page="search">Search</button>
    </nav>

    <main>
      <section class="page-head" aria-live="polite">
        <h1 id="pageTitle">Overview</h1>
        <p id="updatedText">Loading latest report</p>
      </section>

      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
